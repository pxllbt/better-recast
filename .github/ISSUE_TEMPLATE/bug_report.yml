name: "Bug Report"
description: "Report a Better Recast issue"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for flagging something. Check existing issues first if you can.

  - type: textarea
    id: description
    attributes:
      label: What's wrong
      description: Describe the bug.
      placeholder: "When starting a recording, ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How do you trigger it?
      placeholder: |
        1. Click record button
        2. Wait for countdown
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: gpu_vendor
    attributes:
      label: GPU
      description: Which GPU vendor is this running on?
      options:
        - "AMD (VAAPI)"
        - "NVIDIA (NVENC)"
        - "Intel (QuickSync)"
        - "CPU fallback"
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: System info
      description: Output of `gpu-screen-recorder --info`, `hyprctl version`, and distro.
      render: shell
      placeholder: |
        GSR: 6.1.0
        Hyprland: 0.44.0
        Distro: Arch Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from `recast status` or system journal.
      render: shell