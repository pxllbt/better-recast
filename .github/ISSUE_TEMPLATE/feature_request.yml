name: "Feature Request"
description: "Suggest an idea for Better Recast"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Let me know what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Is this about a limitation or frustration you hit?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you want
      description: Describe the feature.
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other approaches you looked at.

  - type: textarea
    id: performance_impact
    attributes:
      label: Performance impact
      description: Does this add idle CPU overhead or affect recording latency?
      placeholder: "Near-zero overhead — event-driven and hardware accelerated."