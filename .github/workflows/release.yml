name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Release Tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          tar -czvf "better-recast-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: better-recast-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
